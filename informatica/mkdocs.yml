
site_name: Informática ASIX
site_description: Portal de informática, sistemas, redes y tecnología.
site_author: Josep



theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Sistemas:
      - Linux: sistemas/linux.md
      - Windows: sistemas/windows.md
      - Virtualización: sistemas/virtualizacion.md
  - Redes:
      - Fundamentos: redes/redes.md
      - DNS: redes/dns.md
      - DHCP: redes/dhcp.md
  - Servidores:
      - Nginx: servidores/nginx.md
      - Apache: servidores/apache.md
      - MySQL: servidores/mysql.md
      - phpMyAdmin: servidores/phpmyadmin.md
  - DevOps:
      - Docker: devops/docker.md
      - Git: devops/git.md
      - GitHub: devops/github.md
  - Seguridad:
      - Seguridad informática: seguridad/seguridad.md
